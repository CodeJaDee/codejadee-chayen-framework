<h1>Products</h1>

<div class="search">
  <input type="search" placeholder="Search products" aria-label="Search products" [value]="query()" (input)="search($any($event.target).value)" />
  <button type="button" (click)="clear()">Clear</button>
</div>

<ul class="products">
  @for (p of visible(); track p.sku) {
    <li><span class="sku">{{ p.sku }}</span> {{ p.name }} <span class="price">{{ p.price | currency }}</span></li>
  } @empty {
    <li class="empty">No products match</li>
  }
</ul>
