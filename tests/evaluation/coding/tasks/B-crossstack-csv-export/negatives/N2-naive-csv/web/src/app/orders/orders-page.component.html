<h1>Orders</h1>

<label>
  Status
  <select (change)="selectStatus($any($event.target).value)">
    <option value="">All</option>
    @for (s of statuses; track s) {
      <option [value]="s">{{ s }}</option>
    }
  </select>
</label>

<button type="button" (click)="exportCsv()">Export CSV</button>

<table>
  <thead>
    <tr><th>Id</th><th>Customer</th><th>Status</th><th>Total</th><th>Placed on</th></tr>
  </thead>
  <tbody>
    @for (o of rows(); track o.id) {
      <tr><td>{{ o.id }}</td><td>{{ o.customer }}</td><td>{{ o.status }}</td><td>{{ o.total | currency }}</td><td>{{ o.placedOn }}</td></tr>
    }
  </tbody>
</table>
