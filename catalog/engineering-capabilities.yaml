# Chayen Engineering Capability Catalog
#
# Canonical, developer-side source of truth for REQ-05: 206 capabilities in
# 20 engineering domains. It is NOT shipped in the plugin and the model never
# reads it. Routing lives in the entry skills (ADR-0004).
#
# Inventory source: the user's Step 07 prompt (2026-10-14). Domain titles,
# capability names, order, and counts are verbatim and must not be renamed
# or omitted. The checker compares this file against that inventory.
#
# Check:  node tools/catalog/check-catalog.mjs
# Guide:  docs/chayen/CAPABILITY_COVERAGE.md
#
# Format (D-021): a restricted YAML subset, so the zero-dependency checker can
# parse it. Every file in this subset is also valid YAML 1.2.
#   - two-space indentation, block mappings and block sequences
#   - scalars are plain tokens [A-Za-z0-9][A-Za-z0-9._/-]*, integers, or
#     double-quoted strings without backslashes or embedded double quotes
#   - flow sequences [a, b] and flow mappings {k: v} hold plain tokens only
#   - full-line comments only; no anchors, aliases, tags, or block scalars
#
# Paths in entry_skills, recipe, existing_coverage, and consolidation_groups
# are relative to catalog.plugin_root. Recipes are skill-local (D-016).

catalog:
  id: chayen-engineering-capabilities
  version: 0.1.0
  status: PROPOSED
  date: "2026-10-14"
  plugin_root: plugins/codejadee-chayen-framework
  expected_domains: 20
  expected_capabilities: 206

status_vocabulary: [PLANNED, IN_PROGRESS, IMPLEMENTED, VERIFIED, BLOCKED, DEFERRED]
mapping_vocabulary: [existing, planned]

status_rules:
  - "PLANNED: no shipped content in the mapped entry skill implements this capability yet."
  - "IN_PROGRESS: the mapped entry skill already ships a workflow step, section, or reference that addresses the core purpose (listed in existing_coverage), but the record is not fully implemented and nothing is verified at capability level."
  - "IMPLEMENTED: the recipe exists, covers every output in the record without placeholder content, and lists verification_evidence that is still pending; verification has not passed yet."
  - "VERIFIED: the verification approach was executed and passed, and verification_evidence cites the recorded result."
  - "COMPLETED is not a status. Writing or editing a catalog entry never changes a capability's status by itself."

mapping_rules:
  - "entry_skill.mapping is existing only when skills/<name>/SKILL.md exists in the plugin; otherwise planned."
  - "recipe.mapping is existing only when the recipe file exists; a planned recipe path must not exist yet."
  - "A recipe always lives inside its entry skill directory (D-016). Capabilities that share a recipe form a consolidation group and keep their own identity."
  - "overlaps lists capabilities in other recipes that touch the same work; the relation is symmetric and is resolved by hand-off, not by merging identities."
  - "secondary_skills lists other entry skills whose descriptions may also attract the request; they hand off by name."

stack_packs: [dotnet-aspnetcore, angular, sqlserver, typescript-javascript, react, nextjs, vue, nuxt, vite, nitro, elysia, python, postgresql, java]

stack_groups:
  server-stacks: [dotnet-aspnetcore, typescript-javascript, nitro, elysia, nextjs, nuxt, python]
  web-ui-stacks: [angular, react, nextjs, vue, nuxt, vite, typescript-javascript]
  sql-stacks: [sqlserver, postgresql]
  test-stacks: [dotnet-aspnetcore, typescript-javascript, angular, react, vue, python]

entry_skills:
  - name: chayen-repository
    mapping: existing
    scope: "Read-only orientation in an existing repository: stacks, layout, commands, conventions, dependencies, change impact, history, ownership, debt, and unknowns."
  - name: chayen-requirements
    mapping: existing
    scope: "Turn requests into clear, testable requirements: elicitation, stories, acceptance criteria, use cases, business rules, traceability, scope, NFRs, decomposition, and sizing."
  - name: chayen-architecture
    mapping: existing
    scope: "Design, decide, and plan: architecture review and fitness tests, options and ADRs, decision register and waivers, boundaries, domain and component design, data flow, multitenancy, resilience, realtime and multi-region design, migration strategy, and rollout plans (D-029)."
  - name: chayen-implementation
    mapping: existing
    scope: "Plan and deliver code changes: task contract, plan, risk classes, features, bug fixes, refactors, safe edits, algorithms, concurrency, errors, dependency upgrades (D-031), configuration, flags, generated code, compatibility, and the change summary or passport."
  - name: chayen-backend
    mapping: existing
    scope: "Server-side application code: API design and implementation, validation, versioning, authn and authz implementation, messaging, jobs, integrations, webhooks, idempotency, payments consistency, GraphQL schema evolution, and file processing."
  - name: chayen-frontend
    mapping: existing
    scope: "Browser UI code: features, components, state, forms, layout, accessibility, performance, design systems, i18n, UI errors, browser extensions, and web-technology mobile or desktop shells (PWA, Capacitor or Ionic, Electron, Tauri; D-032)."
  - name: chayen-data
    mapping: existing
    scope: "Relational data work on SQL Server and PostgreSQL: modeling, migrations, queries, indexes, transactions, integrity, data migration and backfills, ETL, quality, retention and governance, backup drills, search, and geospatial data (created in Step 13, D-033)."
  - name: chayen-testing
    mapping: existing
    scope: "Automated testing: strategy, unit, integration, end-to-end, contract and API tests, regression, property-based, mutation and fuzz testing, test data, flaky and failing tests, and coverage gaps."
  - name: chayen-security
    mapping: existing
    scope: "Advisory application security and privacy: threat models, secure review, scanner triage, dependencies, secrets, authorization and access reviews, validation, SSRF, crypto, privacy, logging, SBOM and licences, and remediation, and read-only container and IaC security review (D-034)."
  - name: chayen-performance
    mapping: existing
    scope: "Measurement-driven performance: baselines, profiling, load tests, bottlenecks, memory leaks, latency budgets, capacity, caching, and cost-performance (created in Step 14; L0 cap raised to 4,400, D-034)."
  - name: chayen-devops
    mapping: planned
    scope: "Build, ship, and operate: build systems, CI and CD, containers, IaC, environments, secrets, releases, deployment and rollback checks (rollout planning moved to chayen-architecture, D-029), provenance, policy as code, observability, alerts, incidents, RCA, postmortems, DR, runbooks, and hotfixes. Container and IaC security review moved to chayen-security (D-034)."
  - name: chayen-modernization
    mapping: planned
    scope: "Evolve existing systems safely: legacy assessment, dead code, deprecations, and debt prioritization. Migration strategy, strangler, and modularization moved to chayen-architecture (D-029); dependency and framework upgrades and breaking-change analysis moved to chayen-implementation (D-031)."
  - name: chayen-documentation
    mapping: planned
    scope: "Engineering documentation and review collaboration: READMEs, API and architecture docs, onboarding guides, knowledge transfer, release notes, pull requests, code review, review comments, standards checks, and git workflow."
  - name: chayen-ai-engineering
    mapping: planned
    scope: "ML, LLM, and agent engineering: datasets, experiments, evaluation, serving, drift, RAG, prompt and tool evaluation, LLM safety and observability, agent skills, provider compatibility, agent policies, session handoff, and benchmarking."

