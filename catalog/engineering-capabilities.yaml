capabilities:

  # ---------------------------------------------------------------------------
  # D01 REPOSITORY (9)
  # ---------------------------------------------------------------------------
  - id: CAP-01-001
    name: repo-onboarding
    domain: D01
    purpose: "Give a newcomer a working mental model of an unfamiliar repository: what it is, which stacks and versions it uses, how to build, test, and run it, and which instruction files govern changes."
    positive_triggers:
      - "I just cloned this repo. How is it structured and how do I run the tests?"
      - "Get me up to speed on this codebase before I start on my first ticket."
      - "What do I need installed to build and run this project locally?"
    negative_triggers:
      - "Write an onboarding guide document for new hires → CAP-16-004 developer-onboarding-guide"
      - "What is a monorepo, in general? → native answer, no repository involved"
    inputs:
      - "Read access to the repository working tree"
      - "Optional focus area or role (backend, frontend, data)"
    outputs:
      - "Repository profile: stacks and versions with source files, layout, entry points, build/test/lint commands marked found or inferred, instruction-file rules"
      - "List of unknowns that could not be determined from the files"
