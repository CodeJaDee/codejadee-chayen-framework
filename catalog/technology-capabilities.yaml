capabilities:
  - id: TECH-CSHARP-001
    name: csharp-nullability
    pack: dotnet-aspnetcore
    technology: csharp
    purpose: "Enable, fix, and annotate nullable reference types in C# so the compiler's null analysis matches real behaviour, including framework effects on API models, EF Core columns, and JSON."
    applies_when: "A C# project enables nullable reference types, has CS86xx warnings, or must annotate an API for null."
    not_when: "The project is not C#, or the task is a single null reference bug or an endpoint contract alone."
    inputs:
      - "Projects and their Nullable settings"
      - "Nullable warning baseline"
      - "Public surface and framework consumers of the types"
    outputs:
      - "Annotated code with guards and attributes"
      - "Warning counts before and after"
      - "List of contract or schema effects"
    entry_skill: chayen-implementation
    reference: skills/chayen-implementation/references/csharp-types-and-nullability.md
