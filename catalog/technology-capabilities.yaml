# Chayen Technology Capability Catalog
#
# Developer-side source of truth for technology packs: stack-specific
# capabilities that sit beside the 206 engineering capabilities in
# engineering-capabilities.yaml (which are unchanged). It is NOT shipped and
# the model never reads it. Each record maps a capability to the entry skill
# and the technology reference section that implements it (D-039).
#
# Inventory sources: user Steps 20–22 (2026-10-15): 22 .NET,
# 14 Angular, 8 shared TS/JS, 8 React and 8 Next.js names, verbatim.
#
# Check:  node tools/catalog/check-technology.mjs
# Guide:  docs/chayen/TECHNOLOGY_COVERAGE.md
# Facts:  node tests/technology/dotnet/run-fact-checks.mjs
#         node tests/technology/angular-typescript/run-fact-checks.mjs
#         node tests/technology/react-nextjs/run-fact-checks.mjs (includes synthetic boundary checks)
#
# Format: the same restricted YAML subset as engineering-capabilities.yaml
# (D-021). Reference paths are relative to catalog.plugin_root.

catalog:
  id: chayen-technology-capabilities
  version: 0.1.0
  status: PROPOSED
  date: "2026-10-15"
  plugin_root: plugins/codejadee-chayen-framework
  engineering_catalog: catalog/engineering-capabilities.yaml

status_vocabulary: [PLANNED, IN_PROGRESS, IMPLEMENTED, VERIFIED, BLOCKED, DEFERRED]

status_rules:
  - "PLANNED: no reference section implements the capability yet."
  - "IMPLEMENTED: the mapped reference has the capability section with applicability, version notes, steps, and verification; evaluation cases exist; verification_evidence names what is still pending."
  - "VERIFIED: behaviour evals on a fixture repository and trigger evals for the entry skill were executed and passed. Framework fact checks alone never make a capability VERIFIED."

