# Chayen Technology Capability Catalog
#
# Developer-side source of truth for technology packs: stack-specific
# capabilities that sit beside the 206 engineering capabilities in
# engineering-capabilities.yaml (which are unchanged). It is NOT shipped and
# the model never reads it. Each record maps a capability to the entry skill
# and the technology reference section that implements it (D-039).
#
# Inventory source: the user's Step 20 prompt (2026-10-15): 8 C# and 14
# ASP.NET Core capability names, verbatim. The checker compares against it.
#
# Check:  node tools/catalog/check-technology.mjs
# Guide:  docs/chayen/TECHNOLOGY_COVERAGE.md
# Facts:  node tests/technology/dotnet/run-fact-checks.mjs
#
# Format: the same restricted YAML subset as engineering-capabilities.yaml
# (D-021). Reference paths are relative to catalog.plugin_root.

catalog:
  id: chayen-technology-capabilities
  version: 0.1.0
  status: PROPOSED
  date: "2026-10-15"
  plugin_root: plugins/codejadee-chayen-framework
  engineering_catalog: catalog/engineering-capabilities.yaml

status_vocabulary: [PLANNED, IN_PROGRESS, IMPLEMENTED, VERIFIED, BLOCKED, DEFERRED]

status_rules:
  - "PLANNED: no reference section implements the capability yet."
  - "IMPLEMENTED: the mapped reference has the capability section with applicability, version notes, steps, and verification; evaluation cases exist; verification_evidence names what is still pending."
  - "VERIFIED: behaviour evals on a fixture repository and trigger evals for the entry skill were executed and passed. Framework fact checks alone never make a capability VERIFIED."

packs:
  - id: dotnet-aspnetcore
    title: "C#, ASP.NET Core Web API, and .NET application development"
    technologies: [csharp, aspnetcore]
    expected_capabilities: 22
    detection: "A .csproj or Directory.Build.props; Microsoft.NET.Sdk.Web for ASP.NET Core; TargetFramework and global.json for the version"
    fact_checks: tests/technology/dotnet/run-fact-checks.mjs
    status: IMPLEMENTED

capabilities:
  - id: TECH-CSHARP-001
    name: csharp-nullability
    pack: dotnet-aspnetcore
    technology: csharp
    purpose: "Enable, fix, and annotate nullable reference types in C# so the compiler's null analysis matches real behaviour, including framework effects on API models, EF Core columns, and JSON."
    applies_when: "A C# project enables nullable reference types, has CS86xx warnings, or must annotate an API for null."
    not_when: "The project is not C#, or the task is a single null reference bug or an endpoint contract alone."
    inputs:
      - "Projects and their Nullable settings"
      - "Nullable warning baseline"
      - "Public surface and framework consumers of the types"
    outputs:
      - "Annotated code with guards and attributes"
      - "Warning counts before and after"
      - "List of contract or schema effects"
    entry_skill: chayen-implementation
    reference: skills/chayen-implementation/references/csharp-types-and-nullability.md
    section: "Nullable reference types (csharp-nullability)"
    engineering_capabilities: [CAP-05-002, CAP-05-003, CAP-05-012]
    fact_checks: [TF-04, TF-13, TF-21]
    verification: "Behaviour eval on a .NET fixture repository using the positive and negative cases in tests/skills/technology-cases.json, plus trigger evals for chayen-implementation; framework facts TF-04, TF-13, TF-21 by run-fact-checks.mjs."
    verification_evidence: "Step 20: section reviewed against this record (agent review); static check V-23 PASS; cases tc-csharp-nullability-* in tests/skills/technology-cases.json; framework facts TF-04, TF-13, TF-21 PASS on the .NET 10.0.401 and 8.0.406 SDKs. Pending: behaviour evals (G-12) and trigger evals (G-11) NOT_RUN."
    status: IMPLEMENTED

